name: Deploy website

# Publishes docs/ to GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# Runs on pushes that touch the site, by hand, and from the daily data update:
# commits pushed with GITHUB_TOKEN don't trigger Pages builds or push workflows,
# so the daily workflow calls this one directly.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # When called after the data update, deploy the commit it just pushed,
          # not the one the daily run started from.
          ref: main

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
